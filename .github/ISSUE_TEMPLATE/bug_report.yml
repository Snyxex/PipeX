name: Bug report
description: Report a reproducible PipeX defect (not a security vulnerability)
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "For security-sensitive findings, use the private reporting instructions in SECURITY.md instead of opening a public issue."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal sanitized code or steps, without real credentials or private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PipeX version or commit
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and platform
      placeholder: Node.js 24.x on Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all secrets, access tokens and personal information before posting.
