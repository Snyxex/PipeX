name: Feature request
description: Suggest an improvement consistent with PipeX's scope
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the API or behavior, alternatives and compatibility concerns.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Mention security, stream backpressure, file boundaries or performance impacts.
