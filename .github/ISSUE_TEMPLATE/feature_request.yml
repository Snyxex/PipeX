name: Feature request
description: Propose an API or data-pipeline improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Keep proposals within PipeX's data-transformation scope. Do not include secrets or security vulnerability details."
  - type: textarea
    id: usecase
    attributes:
      label: Problem and use case
      description: Describe what users need to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Include sanitized sample code and compatibility considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: concerns
    attributes:
      label: Compatibility, performance and security impact
      description: Consider ESM/CJS, streams, backpressure, cancellation, resource limits and key handling.
